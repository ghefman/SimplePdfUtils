<script>
(function () {
  var IOS     = 'https://apps.apple.com/app/simple-pdf-utils/id6772066280';
  var ANDROID = 'https://play.google.com/store/apps/details?id=com.deltawebos.pdfutils';
  var SITE    = '../';

  var m = location.search.match(/[?&]platform=([^&]*)/);
  var ua = navigator.userAgent || '';
  var target;

  if (m) {
    // Test override: ?platform=ios | android | other
    var p = decodeURIComponent(m[1]).toLowerCase();
    target = p === 'ios' ? IOS : p === 'android' ? ANDROID : SITE;
  } else if (/Android/.test(ua)) {
    target = ANDROID;
  } else if (/iPad|iPhone|iPod/.test(ua) ||
             (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) {
    // iPadOS 13+ reports a desktop Safari UA; a real Mac has maxTouchPoints 0.
    target = IOS;
  } else {
    target = SITE;
  }

  // replace() keeps this page out of history, so Back from the store
  // returns the visitor to where they came from instead of bouncing again.
  location.replace(target);
})();
</script>
